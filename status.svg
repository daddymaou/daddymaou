<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1450" viewBox="0 0 900 1450" fill="none">
  <defs>
    <!-- Soft background -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7F7F5"/>
      <stop offset="100%" stop-color="#F0F0EE"/>
    </linearGradient>

    <!-- Subtle floating shapes animation -->
    <style>
      .float1 { animation: floatA 18s ease-in-out infinite; }
      .float2 { animation: floatB 22s ease-in-out infinite; }
      .float3 { animation: floatC 26s ease-in-out infinite; }
      .float4 { animation: floatA 20s ease-in-out infinite reverse; }
      .float5 { animation: floatB 24s ease-in-out infinite reverse; }

      @keyframes floatA {
        0%, 100% { transform: translate(0, 0); opacity: 0.35; }
        50% { transform: translate(12px, -18px); opacity: 0.55; }
      }
      @keyframes floatB {
        0%, 100% { transform: translate(0, 0); opacity: 0.25; }
        50% { transform: translate(-15px, 12px); opacity: 0.45; }
      }
      @keyframes floatC {
        0%, 100% { transform: translate(0, 0); opacity: 0.3; }
        50% { transform: translate(8px, 15px); opacity: 0.5; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="1450" fill="url(#bg)"/>

  <!-- Minimal floating shapes -->
  <circle class="float1" cx="120" cy="180" r="38" fill="#E8E8E4"/>
  <circle class="float2" cx="780" cy="260" r="52" fill="#EDEDE9"/>
  <circle class="float3" cx="160" cy="720" r="44" fill="#E6E6E2"/>
  <circle class="float4" cx="750" cy="980" r="36" fill="#EAEAE6"/>
  <circle class="float5" cx="90" cy="1180" r="48" fill="#E9E9E5"/>
  <circle class="float1" cx="820" cy="1320" r="30" fill="#ECECE8"/>
  <circle class="float2" cx="450" cy="80" r="22" fill="#EFEFEB"/>
  <circle class="float3" cx="680" cy="560" r="28" fill="#E7E7E3"/>
  <circle class="float4" cx="230" cy="1050" r="34" fill="#EBEBE7"/>

  <!-- Soft vertical lines for structure -->
  <line x1="80" y1="0" x2="80" y2="1450" stroke="#E5E5E1" stroke-width="1" opacity="0.6"/>
  <line x1="820" y1="0" x2="820" y2="1450" stroke="#E5E5E1" stroke-width="1" opacity="0.6"/>

  <!-- ========== HEADER ========== -->
  <text x="450" y="160" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="54" font-weight="600" fill="#111111" letter-spacing="-1.8">
    ᗰᗩOᑌ.
  </text>

  <text x="450" y="205" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" fill="#888888" letter-spacing="4">
    CODE  ·  AUTOMATE  ·  ITERATE
  </text>

  <!-- Thin elegant divider -->
  <line x1="340" y1="235" x2="560" y2="235" stroke="#D8D8D4" stroke-width="1"/>

  <!-- ========== STATUS ========== -->
  <text x="450" y="285" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#777777" letter-spacing="2.5">
    OPERATIONAL  ·  NIGERIA  ·  2026
  </text>

  <!-- ========== ABOUT ========== -->
  <text x="450" y="370" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#AAAAAA" letter-spacing="3">
    ABOUT
  </text>

  <text x="450" y="415" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#222222">
    I build digital experiences that feel human and distinct.
  </text>
  <text x="450" y="445" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" fill="#666666">
    Clean design · Practical functionality · Quiet confidence
  </text>

  <!-- ========== CAPABILITIES ========== -->
  <text x="450" y="530" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#AAAAAA" letter-spacing="3">
    CAPABILITIES
  </text>

  <!-- Capability cards (simple rounded rects) -->
  <rect x="110" y="560" width="200" height="70" rx="12" fill="#FFFFFF" stroke="#E5E5E1" stroke-width="1"/>
  <text x="210" y="590" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#222">Frontend</text>
  <text x="210" y="612" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#777">HTML · CSS · JS · React</text>

  <rect x="350" y="560" width="200" height="70" rx="12" fill="#FFFFFF" stroke="#E5E5E1" stroke-width="1"/>
  <text x="450" y="590" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#222">Backend</text>
  <text x="450" y="612" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#777">Python · Node · Django</text>

  <rect x="590" y="560" width="200" height="70" rx="12" fill="#FFFFFF" stroke="#E5E5E1" stroke-width="1"/>
  <text x="690" y="590" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#222">Systems</text>
  <text x="690" y="612" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#777">Java · C++ · Automation</text>

  <!-- ========== FOCUS ========== -->
  <text x="450" y="700" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#AAAAAA" letter-spacing="3">
    FOCUS
  </text>

  <rect x="110" y="730" width="160" height="55" rx="10" fill="#FFFFFF" stroke="#E5E5E1" stroke-width="1"/>
  <text x="190" y="763" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#333">Web Development</text>

  <rect x="290" y="730" width="160" height="55" rx="10" fill="#FFFFFF" stroke="#E5E5E1" stroke-width="1"/>
  <text x="370" y="763" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#333">UI / UX Design</text>

  <rect x="470" y="730" width="160" height="55" rx="10" fill="#FFFFFF" stroke="#E5E5E1" stroke-width="1"/>
  <text x="550" y="763" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#333">Creative Dev</text>

  <rect x="650" y="730" width="160" height="55" rx="10" fill="#FFFFFF" stroke="#E5E5E1" stroke-width="1"/>
  <text x="730" y="763" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#333">Automation</text>

  <!-- ========== TELEMETRY ========== -->
  <text x="450" y="860" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#AAAAAA" letter-spacing="3">
    PRESENCE
  </text>

  <rect x="200" y="890" width="500" height="90" rx="14" fill="#FFFFFF" stroke="#E5E5E1" stroke-width="1"/>
  <text x="450" y="930" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#333">Based in Nigeria · Open to global collaboration</text>
  <text x="450" y="958" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#777">4 years building human interfaces &amp; practical systems</text>

  <!-- ========== DOCK ========== -->
  <text x="450" y="1060" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#AAAAAA" letter-spacing="3">
    CONNECT
  </text>

  <!-- Social pills -->
  <rect x="170" y="1090" width="130" height="42" rx="21" fill="#111111"/>
  <text x="235" y="1117" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#FFFFFF">Telegram</text>

  <rect x="320" y="1090" width="130" height="42" rx="21" fill="#111111"/>
  <text x="385" y="1117" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#FFFFFF">Discord</text>

  <rect x="470" y="1090" width="130" height="42" rx="21" fill="#111111"/>
  <text x="535" y="1117" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#FFFFFF">WhatsApp</text>

  <rect x="620" y="1090" width="110" height="42" rx="21" fill="#111111"/>
  <text x="675" y="1117" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#FFFFFF">GitHub</text>

  <!-- ========== FOOTER ========== -->
  <line x1="300" y1="1220" x2="600" y2="1220" stroke="#D8D8D4" stroke-width="1"/>

  <text x="450" y="1270" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="500" fill="#222222" letter-spacing="1">
    Code. Automate. Iterate.
  </text>

  <text x="450" y="1310" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#999999">
    © 2026 ᗰᗩOᑌ
  </text>
</svg>
